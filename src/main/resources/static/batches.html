<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batches - Smart Indian Poultry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="appNavbarMount"></div>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
                <h2 class="fw-bold text-success mb-1">🐣 <span data-i18n="nav_batches">Batches</span></h2>
                <p class="text-muted mb-0">Live age (days & weeks), live bird counts, mortality %, and flexible cycle lengths per breed.</p>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <a href="/daily-records.html" class="btn-agri-outline text-decoration-none">📝 Daily Entry</a>
                <a href="/create-batch.html" class="btn-agri text-decoration-none d-none" id="btnCreateBatchLink">
                    ➕ <span data-i18n="nav_create_batch">Create Batch</span>
                </a>
            </div>
        </div>

        <!-- Filters -->
        <div class="agri-card p-3 mb-4">
            <div class="row g-2">
                <div class="col-md-4">
                    <select id="filterFarm" class="form-select" onchange="loadBatches()">
                        <option value="">🏡 All Accessible Farms</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <select id="filterCategory" class="form-select" onchange="loadBatches()">
                        <option value="">🐔 All Categories (Broiler / Layer / Desi)</option>
                        <option value="BROILER">Broiler</option>
                        <option value="LAYER">Egg Layer</option>
                        <option value="INDIGENOUS">Indigenous / Desi</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <select id="filterStatus" class="form-select" onchange="loadBatches()">
                        <option value="">📋 All Statuses</option>
                        <option value="ACTIVE">Active</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="REOPENED">Reopened for Correction</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row g-4" id="batchesGrid"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/app.js"></script>
    <script>
        let currentUser = null;

        async function loadBatches() {
            const params = new URLSearchParams();
            const f = document.getElementById("filterFarm").value;
            const c = document.getElementById("filterCategory").value;
            const s = document.getElementById("filterStatus").value;
            if (f) params.set("farmId", f);
            if (c) params.set("category", c);
            if (s) params.set("status", s);

            const res = await PoultryApp.apiFetch("/api/batches?" + params.toString());
            const list = res.data || [];
            const grid = document.getElementById("batchesGrid");

            if (list.length === 0) {
                grid.innerHTML = `<div class="col-12"><div class="agri-card p-5 text-center text-muted">No batches match this filter. Tap Create Batch to start a new flock!</div></div>`;
                return;
            }

            const canWrite = ["SUPER_ADMIN", "FARM_ADMIN", "FARM_MANAGER"].includes(currentUser.role);
            const canReopen = ["SUPER_ADMIN", "FARM_ADMIN"].includes(currentUser.role);

            grid.innerHTML = list.map(b => {
                const isCompleted = b.status === "COMPLETED";
                const opsHref = b.batchCategory === "LAYER"
                    ? `/layer-management.html?batchId=${b.id}`
                    : `/broiler-management.html?batchId=${b.id}`;
                const opsLabel = b.batchCategory === "LAYER" ? "🥚 Layer Analytics" : "🍗 Growth & FCR";

                return `
                <div class="col-lg-6">
                    <div class="agri-card p-4 h-100 d-flex flex-column justify-content-between">
                        <div>
                            <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
                                <span class="badge bg-success px-3 py-2 rounded-pill">${PoultryApp.escapeHtml(b.batchCode)}</span>
                                <div>
                                    <span class="badge bg-info text-dark me-1">${PoultryApp.escapeHtml(b.batchCategory)}</span>
                                    <span class="badge ${isCompleted ? 'bg-secondary' : 'bg-warning text-dark'}">${PoultryApp.escapeHtml(b.status)}</span>
                                </div>
                            </div>
                            <h4 class="fw-bold text-success mb-1">${PoultryApp.escapeHtml(b.batchName)}</h4>
                            <div class="text-muted small mb-3">
                                🏡 ${PoultryApp.escapeHtml(b.farmName)} • 🏗️ ${PoultryApp.escapeHtml(b.poultryHouseName)} • 🐔 <strong>${PoultryApp.escapeHtml(b.breedName)}</strong>
                            </div>

                            <div class="row g-2 bg-light p-3 rounded-3 mb-3 small">
                                <div class="col-6"><strong>⏱️ Current Age:</strong> ${b.currentAgeDays} days (${b.currentAgeWeeks} wks)</div>
                                <div class="col-6"><strong>📅 Planned Cycle:</strong> ${b.plannedDurationDays} days (Exp: ${b.expectedCompletionDate || '-'})</div>
                                <div class="col-6"><strong>🐣 Purchased:</strong> ${b.totalBirdsPurchased.toLocaleString("en-IN")} (@ ₹${b.purchasePricePerChick})</div>
                                <div class="col-6"><strong>✅ Live Birds Now:</strong> <span class="text-success fw-bold fs-6">${b.currentLiveBirds.toLocaleString("en-IN")}</span></div>
                                <div class="col-6"><strong>⚠️ Mortality / Culls:</strong> ${b.totalMortality} (${b.mortalityPercentage}%) / ${b.totalCulls}</div>
                                <div class="col-6"><strong>🚚 Birds Sold:</strong> ${b.totalBirdsSold.toLocaleString("en-IN")}</div>
                            </div>
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            ${!isCompleted ? `<a href="/daily-records.html?batchId=${b.id}" class="btn-agri btn-sm text-decoration-none">📝 Daily Entry</a>` : ""}
                            <a href="${opsHref}" class="btn-agri-outline btn-sm text-decoration-none">${opsLabel}</a>
                            <a href="/reports.html?batchId=${b.id}" class="btn btn-outline-success btn-sm rounded-3 fw-semibold text-decoration-none">📄 PDF Report</a>
                            ${(!isCompleted && canWrite) ? `<button class="btn btn-outline-danger btn-sm rounded-3 fw-semibold" onclick="completeBatch('${b.id}', '${b.batchCode}')">🏁 Complete Batch</button>` : ""}
                            ${(isCompleted && canReopen) ? `<button class="btn btn-outline-warning text-dark btn-sm rounded-3 fw-semibold" onclick="reopenBatch('${b.id}', '${b.batchCode}')">🔓 Reopen Batch</button>` : ""}
                        </div>
                    </div>
                </div>`;
            }).join("");
        }

        async function completeBatch(id, code) {
            if (!confirm(`Mark batch ${code} as COMPLETED? Ordinary edits will be locked to protect historical data.`)) return;
            try {
                const res = await PoultryApp.apiFetch(`/api/batches/${id}/complete`, { method: "POST" });
                PoultryApp.showToast(res.message, "success");
                await loadBatches();
            } catch (err) {
                PoultryApp.showToast(err.message, "danger");
            }
        }

        async function reopenBatch(id, code) {
            const reason = prompt(`Enter mandatory audit reason to reopen completed batch ${code}:`);
            if (!reason) return;
            try {
                const res = await PoultryApp.apiFetch(`/api/batches/${id}/reopen?reason=${encodeURIComponent(reason)}`, { method: "POST" });
                PoultryApp.showToast(res.message, "success");
                await loadBatches();
            } catch (err) {
                PoultryApp.showToast(err.message, "danger");
            }
        }

        (async function init() {
            currentUser = await PoultryApp.requireAuth(["SUPER_ADMIN", "FARM_ADMIN", "FARM_MANAGER", "FARMER"]);
            if (!currentUser) return;
            PoultryApp.renderProtectedShell("batches");

            if (["SUPER_ADMIN", "FARM_ADMIN", "FARM_MANAGER"].includes(currentUser.role)) {
                document.getElementById("btnCreateBatchLink").classList.remove("d-none");
            }

            const farmsRes = await PoultryApp.apiFetch("/api/farms");
            const farmSel = document.getElementById("filterFarm");
            (farmsRes.data || []).forEach(f => {
                farmSel.insertAdjacentHTML("beforeend", `<option value="${f.id}">${PoultryApp.escapeHtml(f.farmName)}</option>`);
            });
            await loadBatches();
        })();
    </script>
</body>
</html>
