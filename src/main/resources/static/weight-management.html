<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Weight Management - Smart Indian Poultry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="appNavbarMount"></div>

    <main class="container py-4">
        <div class="row g-4">
            <div class="col-lg-5">
                <div class="agri-card p-4">
                    <h3 class="fw-bold text-success mb-2">⚖️ <span data-i18n="nav_weight">Bird Weight</span> Sampling</h3>
                    <p class="text-muted small mb-3">Record sample bird weights and flock uniformity (% within ±10% of average).</p>
                    <form id="weightForm">
                        <div class="mb-3">
                            <label class="form-label">Select Batch *</label>
                            <select id="batchId" class="form-select" onchange="loadWeights()" required></select>
                        </div>
                        <div class="row g-3">
                            <div class="col-6">
                                <label class="form-label">Date *</label>
                                <input type="date" id="recordDate" class="form-control" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Sample Birds Weighed</label>
                                <input type="number" id="sampleBirdCount" class="form-control" min="5" value="50">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Average Bird Weight (grams) *</label>
                                <input type="number" step="0.5" id="averageWeightGrams" class="form-control" placeholder="e.g. 1850" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Min Weight (g)</label>
                                <input type="number" id="minWeightGrams" class="form-control" placeholder="1680">
                            </div>
                            <div class="col-6">
                                <label class="form-label">Max Weight (g)</label>
                                <input type="number" id="maxWeightGrams" class="form-control" placeholder="2010">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Uniformity % (Optional — auto-estimated if blank)</label>
                                <input type="number" step="0.5" id="uniformityPct" class="form-control" placeholder="e.g. 87.5">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Remarks</label>
                                <input type="text" id="remarks" class="form-control" placeholder="Morning empty-crop weighing">
                            </div>
                        </div>
                        <button type="submit" class="btn-agri w-100 mt-4">✅ Save Weight Sample</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="agri-card p-4 mb-4">
                    <h5 class="fw-bold text-success mb-3">📈 Growth Curve vs. Breed Standard</h5>
                    <canvas id="growthChart" height="170"></canvas>
                </div>
                <div class="agri-card p-4">
                    <h5 class="fw-bold text-success mb-3">📜 Recorded Weight History</h5>
                    <div id="weightHistoryCards" class="d-grid gap-2"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/app.js"></script>
    <script>
        let growthChart = null;

        async function loadWeights() {
            const batchId = document.getElementById("batchId").value;
            if (!batchId) return;
            const res = await PoultryApp.apiFetch(`/api/weight-records?batchId=${encodeURIComponent(batchId)}`);
            const list = res.data || [];

            if (growthChart) growthChart.destroy();
            growthChart = new Chart(document.getElementById("growthChart"), {
                type: "line",
                data: {
                    labels: list.map(w => `Day ${w.ageDays} (${w.recordDate})`),
                    datasets: [
                        { label: "Actual Avg Weight (g)", data: list.map(w => w.averageWeightGrams), borderColor: "#2e7d32", tension: 0.25 },
                        { label: "Breed Target (g)", data: list.map(w => w.expectedBreedWeightGrams), borderColor: "#ef6c00", borderDash: [5, 5], tension: 0.25 }
                    ]
                }
            });

            document.getElementById("weightHistoryCards").innerHTML = list.slice().reverse().map(w => `
                <div class="p-3 rounded-3 bg-light border d-flex justify-content-between align-items-center flex-wrap">
                    <div>
                        <strong class="text-success">Day ${w.ageDays} (Week ${w.weekNumber}) — ${w.recordDate}</strong>
                        <div class="small text-muted">Sample: ${w.sampleBirdCount} birds • Uniformity: ${w.uniformityPct || '-'}%</div>
                    </div>
                    <div class="text-end">
                        <span class="fs-5 fw-bold text-dark">${w.averageWeightGrams} g</span>
                        <div class="small text-muted">Target: ${w.expectedBreedWeightGrams || '-'} g</div>
                    </div>
                </div>
            `).join("") || `<div class="text-muted text-center p-3">No weight samples recorded yet.</div>`;
        }

        (async function init() {
            const user = await PoultryApp.requireAuth(["SUPER_ADMIN", "FARM_ADMIN", "FARM_MANAGER", "FARMER"]);
            if (!user) return;
            PoultryApp.renderProtectedShell("weight");
            document.getElementById("recordDate").value = new Date().toISOString().split("T")[0];

            const res = await PoultryApp.apiFetch("/api/batches");
            const sel = document.getElementById("batchId");
            sel.innerHTML = (res.data || []).map(b =>
                `<option value="${b.id}">${PoultryApp.escapeHtml(b.batchCode)} — ${PoultryApp.escapeHtml(b.batchName)} (${b.breedName})</option>`
            ).join("");
            await loadWeights();

            document.getElementById("weightForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                const minV = document.getElementById("minWeightGrams").value;
                const maxV = document.getElementById("maxWeightGrams").value;
                const uniV = document.getElementById("uniformityPct").value;
                try {
                    const saved = await PoultryApp.apiFetch("/api/weight-records", {
                        method: "POST",
                        body: JSON.stringify({
                            batchId: document.getElementById("batchId").value,
                            recordDate: document.getElementById("recordDate").value,
                            sampleBirdCount: Number(document.getElementById("sampleBirdCount").value || 50),
                            averageWeightGrams: Number(document.getElementById("averageWeightGrams").value),
                            minWeightGrams: minV ? Number(minV) : null,
                            maxWeightGrams: maxV ? Number(maxV) : null,
                            uniformityPct: uniV ? Number(uniV) : null,
                            remarks: document.getElementById("remarks").value
                        })
                    });
                    PoultryApp.showToast(saved.message, "success");
                    await loadWeights();
                } catch (err) {
                    PoultryApp.showToast(err.message, "danger");
                }
            });
        })();
    </script>
</body>
</html>
