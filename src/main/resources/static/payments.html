<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments & Dues Settlement - Smart Indian Poultry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="appNavbarMount"></div>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
                <h2 class="fw-bold text-success mb-1">💳 <span data-i18n="nav_payments">Payments & Dues</span></h2>
                <p class="text-muted mb-0">Settle Customer Pending Receivables & Supplier Feed/Chick Credit Payables with automatic ledger balance updates.</p>
            </div>
            <button type="button" class="btn btn-outline-success fw-bold rounded-3"
                    onclick="PoultryApp.speakText('Select Customer Receipt when a buyer pays pending dues, or Supplier Payment when paying feed mills and hatcheries.')">
                🔊 Audio Guide
            </button>
        </div>

        <div class="row g-4">
            <!-- Payment Settlement Form -->
            <div class="col-lg-5">
                <div class="agri-card p-4">
                    <h5 class="fw-bold text-success mb-3">💳 Record Receipt / Supplier Payment</h5>
                    <form id="paymentForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Settlement Direction *</label>
                            <select class="form-select fw-semibold" id="payType" required>
                                <option value="CUSTOMER_RECEIPT">📥 Customer Receipt (Money Received from Buyer)</option>
                                <option value="SUPPLIER_PAYMENT" id="optSupplierPay">📤 Supplier Payment (Money Paid to Supplier)</option>
                            </select>
                        </div>

                        <div class="mb-3" id="custPayWrap">
                            <label class="form-label fw-bold">Select Customer / Buyer *</label>
                            <select class="form-select" id="payCustomer"></select>
                        </div>

                        <div class="mb-3" id="invPayWrap">
                            <label class="form-label fw-bold">Link to Unpaid Sales Invoice (Optional)</label>
                            <select class="form-select" id="payInvoice"><option value="">-- General Account Receipt --</option></select>
                        </div>

                        <div class="mb-3 d-none" id="supPayWrap">
                            <label class="form-label fw-bold">Select Supplier (Feed / Hatchery / Vet) *</label>
                            <select class="form-select" id="paySupplier"></select>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label fw-bold">Payment Date *</label>
                                <input type="date" class="form-control" id="payDate" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-bold">Amount (₹ INR) *</label>
                                <input type="number" step="0.01" min="1" class="form-control" id="payAmt" placeholder="15000" required>
                            </div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label fw-bold">Method *</label>
                                <select class="form-select" id="payMethod">
                                    <option value="UPI">UPI / PhonePe / GPay</option>
                                    <option value="NEFT_RTGS">NEFT / RTGS / IMPS</option>
                                    <option value="CASH">Cash</option>
                                    <option value="CHEQUE">Bank Cheque</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-bold">UTR / Cheque Ref</label>
                                <input type="text" class="form-control" id="payRef" placeholder="UTR4099881122">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Remarks (Voice Supported)</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="payRemarks" placeholder="Part settlement for wholesale lift">
                                <button type="button" class="btn btn-outline-success" onclick="PoultryApp.startVoiceInput(this, 'payRemarks')">🎤</button>
                            </div>
                        </div>

                        <button type="submit" class="btn-agri w-100">✅ Confirm Settlement & Update Ledger</button>
                    </form>
                </div>
            </div>

            <!-- Payment History -->
            <div class="col-lg-7">
                <h5 class="fw-bold mb-3">📜 Settlement Voucher History</h5>
                <div class="row g-3" id="paymentsGrid"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/app.js"></script>
    <script>
        let isNonFarmRole = false;

        function fmtInr(v) {
            return "₹" + Number(v || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 });
        }

        function toggleTypeFields() {
            const t = document.getElementById("payType").value;
            const isCust = t === "CUSTOMER_RECEIPT";
            document.getElementById("custPayWrap").classList.toggle("d-none", !isCust);
            document.getElementById("invPayWrap").classList.toggle("d-none", !isCust);
            document.getElementById("supPayWrap").classList.toggle("d-none", isCust);
        }

        async function loadPartiesAndInvoices() {
            const [custRes, salesRes] = await Promise.all([
                PoultryApp.apiFetch("/api/customers"),
                PoultryApp.apiFetch("/api/sales")
            ]);
            const customers = custRes.data || [];
            document.getElementById("payCustomer").innerHTML = customers.length
                ? customers.map(c => `<option value="${c.id}">${PoultryApp.escapeHtml(c.customerName)} (Pending: ${fmtInr(c.outstandingBalance)})</option>`).join("")
                : `<option value="">No registered customers</option>`;

            const unpaidSales = (salesRes.data || []).filter(s => (s.outstandingBalanceInr || 0) > 0);
            document.getElementById("payInvoice").innerHTML = `<option value="">-- General Account Receipt --</option>` +
                unpaidSales.map(s => `<option value="${s.id}">#${PoultryApp.escapeHtml(s.invoiceNumber)} - ${PoultryApp.escapeHtml(s.customerName)} (Due: ${fmtInr(s.outstandingBalanceInr)})</option>`).join("");

            if (!isNonFarmRole) {
                const supRes = await PoultryApp.apiFetch("/api/suppliers");
                const suppliers = supRes.data || [];
                document.getElementById("paySupplier").innerHTML = suppliers.length
                    ? suppliers.map(sp => `<option value="${sp.id}">${PoultryApp.escapeHtml(sp.supplierName)} (Payable: ${fmtInr(sp.outstandingPayable)})</option>`).join("")
                    : `<option value="">No suppliers registered</option>`;
            }
        }

        async function loadPayments() {
            const res = await PoultryApp.apiFetch("/api/payments");
            const list = res.data || [];
            const grid = document.getElementById("paymentsGrid");
            if (!list.length) {
                grid.innerHTML = `<div class="col-12"><div class="agri-card p-4 text-center text-muted">No payment settlements recorded yet.</div></div>`;
                return;
            }
            grid.innerHTML = list.map(p => {
                const isRec = p.paymentType === "CUSTOMER_RECEIPT";
                return `
                <div class="col-12">
                    <div class="agri-card p-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div>
                            <span class="badge ${isRec ? 'bg-success' : 'bg-primary'} me-2">
                                ${isRec ? '📥 CUSTOMER RECEIPT' : '📤 SUPPLIER PAYMENT'}
                            </span>
                            <strong>${PoultryApp.escapeHtml(isRec ? p.customerName : p.supplierName)}</strong>
                            <div class="small text-muted mt-1">
                                📅 ${PoultryApp.escapeHtml(p.paymentDate)} • ${PoultryApp.escapeHtml(p.paymentMethod)}
                                ${p.transactionRef ? ` • Ref: <b>${PoultryApp.escapeHtml(p.transactionRef)}</b>` : ""}
                                ${p.relatedInvoiceNumber ? ` • Inv #${PoultryApp.escapeHtml(p.relatedInvoiceNumber)}` : ""}
                            </div>
                        </div>
                        <div class="fs-5 fw-bold ${isRec ? 'text-success' : 'text-primary'}">
                            ${isRec ? '+' : '-'}${fmtInr(p.amountInr)}
                        </div>
                    </div>
                </div>`;
            }).join("");
        }

        (async function init() {
            const user = await PoultryApp.requireAuth(["SUPER_ADMIN", "FARM_ADMIN", "FARM_MANAGER", "RETAILER", "CHICKEN_SHOP_OWNER"]);
            if (!user) return;
            PoultryApp.renderProtectedShell("payments");

            isNonFarmRole = ["RETAILER", "CHICKEN_SHOP_OWNER"].includes(user.role);
            if (isNonFarmRole) {
                document.getElementById("optSupplierPay").remove();
            }

            const today = new Date().toISOString().split("T")[0];
            document.getElementById("payDate").value = today;
            document.getElementById("payType").addEventListener("change", toggleTypeFields);
            toggleTypeFields();

            await Promise.all([loadPartiesAndInvoices(), loadPayments()]);

            document.getElementById("paymentForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                try {
                    const pType = document.getElementById("payType").value;
                    await PoultryApp.apiFetch("/api/payments", {
                        method: "POST",
                        body: JSON.stringify({
                            paymentDate: document.getElementById("payDate").value,
                            paymentType: pType,
                            customerId: pType === "CUSTOMER_RECEIPT" ? document.getElementById("payCustomer").value : null,
                            relatedInvoiceId: pType === "CUSTOMER_RECEIPT" ? (document.getElementById("payInvoice").value || null) : null,
                            supplierId: pType === "SUPPLIER_PAYMENT" ? document.getElementById("paySupplier").value : null,
                            amountInr: Number(document.getElementById("payAmt").value),
                            paymentMethod: document.getElementById("payMethod").value,
                            transactionRef: document.getElementById("payRef").value,
                            remarks: document.getElementById("payRemarks").value
                        })
                    });
                    PoultryApp.showToast("Payment settled & outstanding balance updated!", "success");
                    e.target.reset();
                    document.getElementById("payDate").value = today;
                    toggleTypeFields();
                    await Promise.all([loadPartiesAndInvoices(), loadPayments()]);
                } catch (err) {
                    PoultryApp.showToast(err.message, "danger");
                }
            });
        })();
    </script>
</body>
</html>
