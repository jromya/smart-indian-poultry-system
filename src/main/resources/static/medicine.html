<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine & Veterinary Treatments - Smart Indian Poultry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="appNavbarMount"></div>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
                <h2 class="fw-bold text-success mb-1">💊 <span data-i18n="nav_medicine">Medicine & Vet</span></h2>
                <p class="text-muted mb-0">Record poultry antibiotics, vitamins & treatments — enforces expiry safety and auto-deducts medicine stock.</p>
            </div>
            <button type="button" class="btn-agri-outline" onclick="PoultryApp.speakText('audio_health_help')">
                🔊 <span data-i18n="btn_listen_help">Listen Audio Guide</span>
            </button>
        </div>

        <!-- Medicine Cabinet Stock & Expiry Cards -->
        <div class="row g-3 mb-4" id="medicineStockCards"></div>

        <div class="row g-4">
            <!-- Record Medicine Treatment Form -->
            <div class="col-lg-5">
                <div class="agri-card p-4">
                    <h5 class="fw-bold text-success mb-3">🩺 Record Flock Medicine / Supplement</h5>
                    <div id="medFormDraftBanner" class="alert alert-info py-2 small d-none" data-i18n="draft_restored">
                        Saved offline draft restored automatically.
                    </div>

                    <form id="medForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Select Batch *</label>
                            <select class="form-select form-select-lg" name="batchId" id="batchSelect" required onchange="filterMedsForBatch()"></select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Select Medicine from Cabinet *</label>
                            <select class="form-select form-select-lg" name="inventoryItemId" id="medItemSelect" required onchange="showMedMeta()"></select>
                            <div id="medExpiryBanner" class="small mt-1 fw-semibold text-muted"></div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label fw-bold">Date *</label>
                                <input type="date" class="form-control form-control-lg" name="administrationDate" id="adminDate" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-bold">Quantity Used *</label>
                                <input type="number" step="0.05" min="0.05" class="form-control form-control-lg" name="quantityUsed" id="qtyUsed" placeholder="e.g. 0.5" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-7">
                                <label class="form-label fw-bold">Dosage Record *</label>
                                <input type="text" class="form-control form-control-lg" name="dosageRecord" id="dosageInput" placeholder="1 ml / 2L water" required>
                            </div>
                            <div class="col-5">
                                <label class="form-label fw-bold">Route</label>
                                <select class="form-select form-select-lg" name="route" id="routeSelect">
                                    <option value="DRINKING_WATER">Drinking Water</option>
                                    <option value="FEED_MIX">Feed Mix</option>
                                    <option value="INJECTION">Injection</option>
                                    <option value="SPRAY">Spray</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label fw-bold">Course (Days)</label>
                                <input type="number" min="1" class="form-control" name="durationDays" id="durationDays" value="3">
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-bold">Withdrawal (Days)</label>
                                <input type="number" min="0" class="form-control" name="withdrawalPeriodDays" id="withdrawalDays" value="0">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Symptom / Purpose</label>
                            <input type="text" class="form-control" name="diseaseOrPurpose" id="purposeInput" placeholder="Heat stress / respiratory / immunity">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Veterinary Doctor Name</label>
                            <input type="text" class="form-control" name="veterinaryDoctorName" id="vetDocInput" placeholder="Dr. Sneha Joshi (BVSc)">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Veterinary Remarks (Voice Supported)</label>
                            <div class="input-group">
                                <input type="text" class="form-control" name="veterinaryRemarks" id="vetRemarksInput" placeholder="Give in cool morning water">
                                <button type="button" class="btn btn-outline-success px-3" onclick="PoultryApp.startVoiceInput(this, 'vetRemarksInput')">🎤</button>
                            </div>
                        </div>

                        <button type="submit" class="btn-agri w-100 py-3 fs-5">
                            💊 Save Treatment & Deduct Stock
                        </button>
                    </form>
                </div>
            </div>

            <!-- Treatment History -->
            <div class="col-lg-7">
                <div class="agri-card p-4">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                        <h5 class="fw-bold text-success mb-0">📋 Flock Treatment & Dosage History</h5>
                        <select class="form-select form-select-sm" style="width:auto;" id="filterBatchMed" onchange="loadMedicineHistory()">
                            <option value="">All Accessible Batches</option>
                        </select>
                    </div>
                    <div id="medHistoryCards" class="d-grid gap-3"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/app.js"></script>
    <script>
        let batches = [];
        let medItems = [];

        (async function init() {
            const user = await PoultryApp.requireAuth(["SUPER_ADMIN", "FARM_ADMIN", "FARM_MANAGER", "FARMER"]);
            if (!user) return;
            PoultryApp.renderProtectedShell("medicine");
            document.getElementById("adminDate").value = new Date().toISOString().split("T")[0];

            await refreshAll();
            PoultryApp.bindOfflineDraft("medForm", "draft_medicine_v1");

            document.getElementById("medForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                try {
                    const payload = {
                        batchId: document.getElementById("batchSelect").value,
                        inventoryItemId: document.getElementById("medItemSelect").value,
                        administrationDate: document.getElementById("adminDate").value,
                        quantityUsed: parseFloat(document.getElementById("qtyUsed").value),
                        dosageRecord: document.getElementById("dosageInput").value,
                        route: document.getElementById("routeSelect").value,
                        durationDays: parseInt(document.getElementById("durationDays").value || "3", 10),
                        withdrawalPeriodDays: parseInt(document.getElementById("withdrawalDays").value || "0", 10),
                        diseaseOrPurpose: document.getElementById("purposeInput").value,
                        veterinaryDoctorName: document.getElementById("vetDocInput").value,
                        veterinaryRemarks: document.getElementById("vetRemarksInput").value
                    };
                    const res = await PoultryApp.apiFetch("/api/medicines", {
                        method: "POST",
                        body: JSON.stringify(payload)
                    });
                    PoultryApp.showToast(res.message || "Medicine treatment saved!", "success");
                    PoultryApp.clearOfflineDraft("medForm", "draft_medicine_v1");
                    document.getElementById("qtyUsed").value = "";
                    await refreshAll();
                } catch (err) {
                    PoultryApp.showToast(err.message, "danger");
                }
            });
        })();

        async function refreshAll() {
            const [bRes, mRes] = await Promise.all([
                PoultryApp.apiFetch("/api/batches"),
                PoultryApp.apiFetch("/api/inventory?category=MEDICINE")
            ]);
            batches = (bRes.data || []).filter(b => b.status !== "COMPLETED");
            medItems = mRes.data || [];

            document.getElementById("batchSelect").innerHTML = batches.map(b =>
                `<option value="${b.id}" data-farm="${b.farmId}">${PoultryApp.escapeHtml(b.batchCode)} — ${PoultryApp.escapeHtml(b.breedName)}</option>`
            ).join("");

            document.getElementById("filterBatchMed").innerHTML = `<option value="">All Accessible Batches</option>` +
                (bRes.data || []).map(b => `<option value="${b.id}">${PoultryApp.escapeHtml(b.batchCode)}</option>`).join("");

            renderMedCabinetCards();
            filterMedsForBatch();
            await loadMedicineHistory();
        }

        function renderMedCabinetCards() {
            const today = new Date();
            document.getElementById("medicineStockCards").innerHTML = medItems.map(m => {
                let expBadge = `<span class="badge bg-light text-dark border">Valid</span>`;
                if (m.expiryDate) {
                    const days = Math.ceil((new Date(m.expiryDate) - today) / (1000 * 60 * 60 * 24));
                    if (days < 0) expBadge = `<span class="badge bg-danger">🚨 EXPIRED (${m.expiryDate})</span>`;
                    else if (days <= 30) expBadge = `<span class="badge bg-warning text-dark">⏳ Expires in ${days}d (${m.expiryDate})</span>`;
                    else expBadge = `<span class="badge bg-success-subtle text-success border">Exp: ${m.expiryDate}</span>`;
                }
                return `
                <div class="col-md-6 col-lg-4">
                    <div class="agri-card p-3 h-100">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="badge bg-success">${PoultryApp.escapeHtml(m.subCategory || 'MEDICINE')}</span>
                            ${expBadge}
                        </div>
                        <h6 class="fw-bold mb-1">${PoultryApp.escapeHtml(m.itemName)}</h6>
                        <div class="fs-4 fw-bold text-success">${m.currentStock} ${PoultryApp.escapeHtml(m.unit)}</div>
                        <div class="small text-muted">Batch Lot: ${PoultryApp.escapeHtml(m.batchLotNumber || 'N/A')} • ₹${m.unitCostInr}/${PoultryApp.escapeHtml(m.unit)}</div>
                    </div>
                </div>`;
            }).join("");
        }

        function filterMedsForBatch() {
            const bSel = document.getElementById("batchSelect");
            const opt = bSel.options[bSel.selectedIndex];
            const farmId = opt ? opt.getAttribute("data-farm") : null;
            const list = farmId ? medItems.filter(m => m.farmId === farmId) : medItems;
            const mSel = document.getElementById("medItemSelect");
            if (list.length === 0) {
                mSel.innerHTML = `<option value="">No medicine stock on this farm</option>`;
            } else {
                mSel.innerHTML = list.map(m =>
                    `<option value="${m.id}" data-exp="${m.expiryDate || ''}" data-lot="${m.batchLotNumber || ''}" data-unit="${m.unit}" data-stock="${m.currentStock}">
                        ${PoultryApp.escapeHtml(m.itemName)} (${m.currentStock} ${m.unit})
                    </option>`
                ).join("");
            }
            showMedMeta();
        }

        function showMedMeta() {
            const mSel = document.getElementById("medItemSelect");
            const opt = mSel.options[mSel.selectedIndex];
            const el = document.getElementById("medExpiryBanner");
            if (!opt || !opt.value) { el.textContent = ""; return; }
            el.textContent = `Available: ${opt.getAttribute("data-stock")} ${opt.getAttribute("data-unit")} • Lot: ${opt.getAttribute("data-lot") || 'N/A'} • Expiry: ${opt.getAttribute("data-exp") || 'N/A'}`;
        }

        async function loadMedicineHistory() {
            const batchId = document.getElementById("filterBatchMed").value;
            const url = batchId ? `/api/medicines?batchId=${encodeURIComponent(batchId)}` : "/api/medicines";
            const res = await PoultryApp.apiFetch(url);
            const list = res.data || [];
            const el = document.getElementById("medHistoryCards");
            if (list.length === 0) {
                el.innerHTML = `<div class="p-3 bg-light rounded-3 text-muted">No medicine treatments recorded yet.</div>`;
                return;
            }
            el.innerHTML = list.map(r => `
                <div class="p-3 rounded-3 border bg-light">
                    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                        <div>
                            <span class="badge bg-success me-1">${PoultryApp.escapeHtml(r.batchCode)}</span>
                            <strong>${PoultryApp.escapeHtml(r.medicineName)}</strong>
                            <span class="badge bg-secondary ms-1">${PoultryApp.escapeHtml(r.route)}</span>
                        </div>
                        <span class="fw-bold text-success">${r.quantityUsed} ${PoultryApp.escapeHtml(r.unit)} (₹${r.totalMedicineCostInr})</span>
                    </div>
                    <div class="small mt-1"><strong>Dosage:</strong> ${PoultryApp.escapeHtml(r.dosageRecord)} • <strong>Date:</strong> ${r.administrationDate} • <strong>Withdrawal:</strong> ${r.withdrawalPeriodDays || 0} days</div>
                    ${r.veterinaryDoctorName || r.veterinaryRemarks ? `<div class="small text-muted mt-1">👨‍⚕️ ${PoultryApp.escapeHtml(r.veterinaryDoctorName || 'Vet')}: ${PoultryApp.escapeHtml(r.veterinaryRemarks || '')}</div>` : ''}
                </div>
            `).join("");
        }
    </script>
</body>
</html>
