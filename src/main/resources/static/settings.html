<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Smart Indian Poultry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="appNavbarMount"></div>

    <main class="container py-4">
        <h2 class="fw-bold text-success mb-4">⚙️ <span data-i18n="nav_settings">Settings</span></h2>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="agri-card p-4 h-100">
                    <h5 class="fw-bold text-success mb-3">🌐 Language & Voice Accessibility</h5>
                    <p class="text-muted small">Choose your default Indian language. It will be saved to your account for all screens and reports.</p>
                    <div class="mb-3">
                        <label class="form-label" data-i18n="field_language">Preferred Language</label>
                        <select id="settingsLangSelect" class="form-select lang-selector-dropdown"
                                onchange="PoultryApp.changeLanguage(this.value, true)">
                        </select>
                    </div>
                    <button type="button" class="btn-agri-outline w-100" onclick="PoultryApp.speakText('audio_dashboard_help')">
                        🔊 Test Audio Instructions in Selected Language
                    </button>
                </div>
            </div>

            <div class="col-md-6">
                <div class="agri-card p-4 h-100">
                    <h5 class="fw-bold text-success mb-3">🔑 Change Password</h5>
                    <form id="passwordForm">
                        <div class="mb-3">
                            <label class="form-label">Current Password</label>
                            <input type="password" id="currentPassword" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">New Password (Min 6 characters)</label>
                            <input type="password" id="newPassword" class="form-control" minlength="6" required>
                        </div>
                        <button type="submit" class="btn-agri w-100">🔒 Update Password</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/app.js"></script>
    <script>
        (async function init() {
            const user = await PoultryApp.requireAuth();
            if (!user) return;
            PoultryApp.renderProtectedShell("settings");
            document.getElementById("settingsLangSelect").innerHTML = PoultryApp.buildLanguageOptionsHtml();

            document.getElementById("passwordForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                try {
                    const res = await PoultryApp.apiFetch("/api/auth/change-password", {
                        method: "POST",
                        body: JSON.stringify({
                            currentPassword: document.getElementById("currentPassword").value,
                            newPassword: document.getElementById("newPassword").value
                        })
                    });
                    document.getElementById("passwordForm").reset();
                    PoultryApp.showToast(res.message, "success");
                } catch (err) {
                    PoultryApp.showToast(err.message, "danger");
                }
            });
        })();
    </script>
</body>
</html>
