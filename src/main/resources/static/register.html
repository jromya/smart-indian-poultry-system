<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Indian Poultry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar agri-navbar py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="/index.html">
                <span>🐓</span> <span data-i18n="app_title">Smart Indian Poultry</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <select id="regTopLangSelect" class="form-select form-select-sm lang-selector-dropdown fw-semibold" style="width:auto;"
                        onchange="PoultryApp.changeLanguage(this.value, false); document.getElementById('preferredLanguage').value=this.value;"></select>
                <a href="/login.html" class="btn btn-light btn-sm fw-bold px-3 py-2 rounded-3">
                    🔐 <span data-i18n="nav_login">Login</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="agri-card p-4 p-md-5">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
                        <h3 class="fw-bold text-success mb-0">📝 <span data-i18n="register_heading">Create New Poultry Account</span></h3>
                        <button type="button" class="btn-agri-outline btn-sm" onclick="PoultryApp.speakText('register_heading')">
                            🔊 <span data-i18n="btn_listen_help">Listen Audio Guide</span>
                        </button>
                    </div>

                    <div id="registerFormDraftBanner" class="draft-banner mb-3 d-none">
                        💾 <span data-i18n="draft_restored">Saved offline draft restored automatically.</span>
                    </div>

                    <form id="registerForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" data-i18n="field_language">Preferred Language</label>
                                <select id="preferredLanguage" name="preferredLanguage" class="form-select"
                                        onchange="PoultryApp.changeLanguage(this.value, false)">
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" data-i18n="field_role">Select Your Business Role</label>
                                <select id="role" name="role" class="form-select" required>
                                    <option value="FARM_ADMIN">🏡 Farm Admin (Farm Owner)</option>
                                    <option value="FARMER">👨‍🌾 Farmer (Poultry Rearer)</option>
                                    <option value="RETAILER">🥚 Retailer (Chicken & Egg Seller)</option>
                                    <option value="CHICKEN_SHOP_OWNER">🔪 Chicken Shop Owner (Cutting Shop)</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" data-i18n="field_fullname">Full Name</label>
                                <div class="input-group">
                                    <input type="text" id="fullName" name="fullName" class="form-control" placeholder="e.g. Ramesh Kulkarni" required>
                                    <button type="button" class="btn voice-mic-btn" onclick="PoultryApp.startVoiceInput(this, 'fullName')">🎤</button>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" data-i18n="field_phone">10-Digit Mobile Number</label>
                                <input type="tel" id="phone" name="phone" class="form-control" placeholder="e.g. 9876543210" maxlength="10" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" data-i18n="field_username">Username</label>
                                <input type="text" id="username" name="username" class="form-control" placeholder="e.g. ramesh_farm" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" data-i18n="login_password">Password</label>
                                <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Farm / Shop / Business Name</label>
                                <div class="input-group">
                                    <input type="text" id="businessName" name="businessName" class="form-control" placeholder="e.g. Kaveri Desi Poultry">
                                    <button type="button" class="btn voice-mic-btn" onclick="PoultryApp.startVoiceInput(this, 'businessName')">🎤</button>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" data-i18n="field_email">Email Address (Optional)</label>
                                <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label" data-i18n="field_state">State</label>
                                <select id="state" name="state" class="form-select">
                                    <option value="Maharashtra">Maharashtra</option>
                                    <option value="Madhya Pradesh">Madhya Pradesh</option>
                                    <option value="Gujarat">Gujarat</option>
                                    <option value="Punjab">Punjab</option>
                                    <option value="Telangana">Telangana</option>
                                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                                    <option value="Karnataka">Karnataka</option>
                                    <option value="Tamil Nadu">Tamil Nadu</option>
                                    <option value="Kerala">Kerala</option>
                                    <option value="West Bengal">West Bengal</option>
                                    <option value="Odisha">Odisha</option>
                                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                                    <option value="Other">Other State</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label" data-i18n="field_district">District</label>
                                <div class="input-group">
                                    <input type="text" id="district" name="district" class="form-control" placeholder="e.g. Nashik">
                                    <button type="button" class="btn voice-mic-btn" onclick="PoultryApp.startVoiceInput(this, 'district')">🎤</button>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label" data-i18n="field_village">Village / Town</label>
                                <div class="input-group">
                                    <input type="text" id="villageOrCity" name="villageOrCity" class="form-control" placeholder="e.g. Sinnar">
                                    <button type="button" class="btn voice-mic-btn" onclick="PoultryApp.startVoiceInput(this, 'villageOrCity')">🎤</button>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4 d-flex flex-wrap gap-3">
                            <button type="submit" class="btn-agri px-5">
                                ✅ <span data-i18n="btn_save">Save Details</span>
                            </button>
                            <a href="/login.html" class="btn-agri-outline text-decoration-none px-4">
                                🔐 <span data-i18n="nav_login">Login</span>
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/app.js"></script>
    <script>
        const langHtml = PoultryApp.buildLanguageOptionsHtml();
        document.getElementById("regTopLangSelect").innerHTML = langHtml;
        document.getElementById("preferredLanguage").innerHTML = langHtml;
        applyPageTranslations();
        PoultryApp.bindOfflineDraft("registerForm", "draft_register_user");

        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const payload = {
                fullName: document.getElementById("fullName").value,
                username: document.getElementById("username").value,
                phone: document.getElementById("phone").value,
                password: document.getElementById("password").value,
                email: document.getElementById("email").value || null,
                role: document.getElementById("role").value,
                preferredLanguage: document.getElementById("preferredLanguage").value,
                businessName: document.getElementById("businessName").value,
                state: document.getElementById("state").value,
                district: document.getElementById("district").value,
                villageOrCity: document.getElementById("villageOrCity").value
            };

            try {
                const res = await PoultryApp.apiFetch("/api/auth/register", {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                PoultryApp.clearOfflineDraft("registerForm", "draft_register_user");
                PoultryApp.showToast(res.message, "success");
                setTimeout(() => { window.location.href = "/login.html"; }, 1000);
            } catch (err) {
                PoultryApp.showToast(err.message, "danger");
            }
        });
    </script>
</body>
</html>
