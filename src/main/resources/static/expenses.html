<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operating Expenses Ledger - Smart Indian Poultry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="appNavbarMount"></div>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
                <h2 class="fw-bold text-success mb-1">📉 <span data-i18n="nav_expenses">Expenses Ledger</span></h2>
                <p class="text-muted mb-0">Record Labour, Electricity, Diesel/Transportation, Shed Equipment, Cutting Shop Rent & Other Operating Costs.</p>
            </div>
            <button type="button" class="btn btn-outline-success fw-bold rounded-3"
                    onclick="PoultryApp.speakText('Record daily or monthly farm and shop expenses such as labour wages, electricity bills, diesel transport, equipment repairs, or shop rent.')">
                🔊 Audio Guide
            </button>
        </div>

        <div class="row g-4">
            <!-- Record Operating Expense Form -->
            <div class="col-lg-5">
                <div class="agri-card p-4">
                    <h5 class="fw-bold text-success mb-3">➕ Record Operating Expense</h5>
                    <div id="expenseFormDraftBanner" class="alert alert-warning py-2 d-none">
                        📝 Restored unsaved expense draft!
                    </div>
                    <form id="expenseForm">
                        <div class="mb-3" id="expFarmWrap">
                            <label class="form-label fw-bold">Farm *</label>
                            <select class="form-select" id="expFarm" name="farmId"></select>
                        </div>
                        <div class="mb-3" id="expBatchWrap">
                            <label class="form-label fw-bold">Allocate to Specific Batch (Optional)</label>
                            <select class="form-select" id="expBatch" name="batchId"><option value="">-- General Farm Overhead --</option></select>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label fw-bold">Expense Date *</label>
                                <input type="date" class="form-control" id="expDate" name="expenseDate" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-bold">Category *</label>
                                <select class="form-select fw-semibold" id="expCat" name="expenseCategory" required>
                                    <option value="LABOUR">👷 Labour Wages</option>
                                    <option value="ELECTRICITY">⚡ Electricity / Generator</option>
                                    <option value="TRANSPORTATION">🚛 Transportation / Diesel</option>
                                    <option value="EQUIPMENT">🛠️ Equipment / Repairs</option>
                                    <option value="PROCESSING">🔪 Butcher / Ice / Packaging</option>
                                    <option value="SHOP_RENT">🏪 Shop Rent / Municipal</option>
                                    <option value="OTHER">📋 Litter / Husk / Other</option>
                                </select>
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label fw-bold">Amount (₹ INR) *</label>
                                <input type="number" step="0.01" min="1" class="form-control" id="expAmt" name="amountInr" placeholder="2500" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-bold">Payment Mode</label>
                                <select class="form-select" id="expMode" name="paymentMode">
                                    <option value="CASH">Cash</option>
                                    <option value="UPI">UPI</option>
                                    <option value="NEFT_RTGS">Bank Transfer</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Paid To / Vendor Name</label>
                            <input type="text" class="form-control" id="expPayee" name="payeeName" placeholder="MSEDCL / Shed Workers">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Description (Voice Supported)</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="expDesc" name="description" placeholder="Rice husk litter bags & shed cleaning">
                                <button type="button" class="btn btn-outline-success" onclick="PoultryApp.startVoiceInput(this, 'expDesc')">🎤</button>
                            </div>
                        </div>
                        <button type="submit" class="btn-agri w-100">✅ Save Expense Entry</button>
                    </form>
                </div>
            </div>

            <!-- Expenses List -->
            <div class="col-lg-7">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">📋 Recorded Operating Expenses</h5>
                    <span class="badge bg-danger fs-6 px-3 py-2" id="totalExpBadge">Total: ₹0</span>
                </div>
                <div class="row g-3" id="expensesGrid"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/app.js"></script>
    <script>
        function fmtInr(v) {
            return "₹" + Number(v || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 });
        }

        async function loadExpenses() {
            const res = await PoultryApp.apiFetch("/api/expenses");
            const items = res.data || [];
            const total = items.reduce((s, e) => s + (e.amountInr || 0), 0);
            document.getElementById("totalExpBadge").textContent = "Total: " + fmtInr(total);

            const grid = document.getElementById("expensesGrid");
            if (!items.length) {
                grid.innerHTML = `<div class="col-12"><div class="agri-card p-4 text-center text-muted">No operating expenses recorded yet.</div></div>`;
                return;
            }
            grid.innerHTML = items.map(e => `
                <div class="col-12">
                    <div class="agri-card p-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div>
                            <span class="badge bg-warning text-dark me-2">${PoultryApp.escapeHtml(e.expenseCategory)}</span>
                            <strong>${PoultryApp.escapeHtml(e.payeeName || "Operating Expense")}</strong>
                            <div class="small text-muted mt-1">
                                📅 ${PoultryApp.escapeHtml(e.expenseDate)}
                                ${e.batchCode ? ` • Batch: <b>${PoultryApp.escapeHtml(e.batchCode)}</b>` : ""}
                                ${e.description ? ` • ${PoultryApp.escapeHtml(e.description)}` : ""}
                            </div>
                        </div>
                        <div class="text-end">
                            <div class="fs-5 fw-bold text-danger">${fmtInr(e.amountInr)}</div>
                            <span class="badge bg-light text-dark border">${PoultryApp.escapeHtml(e.paymentMode || "CASH")}</span>
                        </div>
                    </div>
                </div>
            `).join("");
        }

        (async function init() {
            const user = await PoultryApp.requireAuth(["SUPER_ADMIN", "FARM_ADMIN", "FARM_MANAGER", "RETAILER", "CHICKEN_SHOP_OWNER"]);
            if (!user) return;
            PoultryApp.renderProtectedShell("expenses");

            const today = new Date().toISOString().split("T")[0];
            document.getElementById("expDate").value = today;

            const isNonFarm = ["RETAILER", "CHICKEN_SHOP_OWNER"].includes(user.role);
            if (isNonFarm) {
                document.getElementById("expFarmWrap").classList.add("d-none");
                document.getElementById("expBatchWrap").classList.add("d-none");
            } else {
                const [farmsRes, batchesRes] = await Promise.all([
                    PoultryApp.apiFetch("/api/farms"),
                    PoultryApp.apiFetch("/api/batches")
                ]);
                document.getElementById("expFarm").innerHTML = (farmsRes.data || [])
                    .map(f => `<option value="${f.id}">${PoultryApp.escapeHtml(f.farmName)}</option>`).join("");
                document.getElementById("expBatch").innerHTML = `<option value="">-- General Farm Overhead --</option>` +
                    (batchesRes.data || []).map(b => `<option value="${b.id}">${PoultryApp.escapeHtml(b.batchCode)} (${PoultryApp.escapeHtml(b.breedName)})</option>`).join("");
            }

            await loadExpenses();
            PoultryApp.bindOfflineDraft("expenseForm", "draft_expense_phase4");

            document.getElementById("expenseForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                try {
                    await PoultryApp.apiFetch("/api/expenses", {
                        method: "POST",
                        body: JSON.stringify({
                            expenseDate: document.getElementById("expDate").value,
                            farmId: isNonFarm ? null : document.getElementById("expFarm").value,
                            batchId: isNonFarm ? null : (document.getElementById("expBatch").value || null),
                            expenseCategory: document.getElementById("expCat").value,
                            amountInr: Number(document.getElementById("expAmt").value),
                            paymentMode: document.getElementById("expMode").value,
                            payeeName: document.getElementById("expPayee").value,
                            description: document.getElementById("expDesc").value
                        })
                    });
                    PoultryApp.clearOfflineDraft("expenseForm", "draft_expense_phase4");
                    PoultryApp.showToast("Operating expense saved!", "success");
                    e.target.reset();
                    document.getElementById("expDate").value = today;
                    await loadExpenses();
                } catch (err) {
                    PoultryApp.showToast(err.message, "danger");
                }
            });
        })();
    </script>
</body>
</html>
